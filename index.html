<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台大拳擊社社員系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">

    <div id="root" class="w-full max-w-md bg-white min-h-screen shadow-lg relative flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 設定正確的 Google Apps Script 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxWeEsxwIqYKpWGsV7Rw1CRiGDd4B2spGRP1S0Y0rw1nBcaAsFhBuprkVe4xBV5193C/exec";
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeeY28dEnSp_oXMDFJPORV7I-XZQzc6kuklSk8dEEscRKYXFQ/viewform";

        function Header({ onBack }) {
            return (
                <header className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white sticky top-0 z-10">
                    <div className="flex items-center space-x-2">
                        <span className="text-xl">🥊</span>
                        <span className="font-bold text-gray-900 tracking-wider">台大拳擊社</span>
                    </div>
                    {onBack && (
                        <button onClick={onBack} className="text-sm font-medium text-gray-600 hover:text-gray-900 px-3 py-1 rounded-lg bg-gray-50 hover:bg-gray-100 transition">
                            返回首頁
                        </button>
                    )}
                </header>
            );
        }

        // 首頁
        function Home({ setPage }) {
            return (
                <div className="flex flex-col gap-4 p-6 mt-4">
                    <div className="text-center mb-6">
                        <div className="text-4xl mb-2">🥊</div>
                        <p className="text-gray-800 font-black text-2xl tracking-wider">台大拳擊社</p>
                        <p className="text-sm text-gray-500">學員報名與條碼系統</p>
                    </div>
                    <button onClick={() => setPage('purchase')} className="w-full bg-slate-100 border-2 border-slate-600 text-slate-800 p-5 rounded-2xl shadow-sm active:scale-95 transition-all text-left">
                        <span className="block text-xl font-bold">1. 購買課程</span>
                        <span className="text-xs opacity-75">選擇身分並填寫報名表單</span>
                    </button>
                    <button onClick={() => setPage('barcode')} className="w-full bg-white border-2 border-red-800 text-red-800 p-5 rounded-2xl shadow-sm active:scale-95 transition-all text-left">
                        <span className="block text-xl font-bold">2. 獲取入場條碼</span>
                        <span className="text-xs opacity-75">忘記條碼或識別碼可由此找回</span>
                    </button>
                </div>
            );
        }

        // 購買課程頁面
        function PurchaseForms({ setPage }) {
            return (
                <div className="p-6 space-y-4">
                    <div className="mb-2">
                        <button onClick={() => setPage('home')} className="text-xs text-blue-600 hover:underline mb-2 inline-block">← 回到主選單</button>
                        <h2 className="text-xl font-bold text-gray-900">請選擇您的報名身分</h2>
                        <p className="text-xs text-gray-500 mt-0.5">點擊下方按鈕前往對應身分的表單填寫頁面</p>
                    </div>

                    {/* 1. 校外人士 */}
                    <div className="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm space-y-3">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="font-bold text-lg text-gray-900">校外人士</h3>
                            </div>
                            <span className="px-3 py-1 bg-gray-900 text-white font-semibold text-sm rounded-full">NT$ 3,500</span>
                        </div>
                        <a href={GOOGLE_FORM_URL} target="_blank" className="block w-full text-center py-3 bg-gray-900 hover:bg-black text-white font-medium rounded-xl shadow transition text-sm">
                            前往校外人士報名表單
                        </a>
                    </div>

                    {/* 2. 台大教職員工生 */}
                    <div className="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm space-y-3">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="font-bold text-lg text-gray-900">台大生</h3>
                            </div>
                            <span className="px-3 py-1 bg-gray-900 text-white font-semibold text-sm rounded-full">NT$ 3,000</span>
                        </div>
                        <a href={GOOGLE_FORM_URL} target="_blank" className="block w-full text-center py-3 bg-gray-900 hover:bg-black text-white font-medium rounded-xl shadow transition text-sm">
                            前往台大生報名表單
                        </a>
                    </div>

                    {/* 3. 體驗生 */}
                    <div className="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm space-y-3">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="font-bold text-lg text-gray-900">體驗生</h3>
                                <p className="text-xs text-gray-500 mt-0.5">單堂體驗課程報名專用</p>
                            </div>
                            <span className="px-3 py-1 bg-gray-900 text-white font-semibold text-sm rounded-full">NT$ 500 / 堂</span>
                        </div>
                        <a href={GOOGLE_FORM_URL} target="_blank" className="block w-full text-center py-3 bg-gray-900 hover:bg-black text-white font-medium rounded-xl shadow transition text-sm">
                            前往體驗生報名表單
                        </a>
                    </div>
                </div>
            );
        }

        // 查詢識別碼頁面
        function BarcodeGenPage({ setPage }) {
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!query.trim()) {
                    setError('請輸入手機號碼或學號');
                    return;
                }
                setLoading(true);
                setError('');
                setResult(null);

                try {
                    const res = await fetch(GAS_URL);
                    const data = await res.json();
                    if (!data.success || !data.members) throw new Error('讀取資料庫失敗');

                    const matched = data.members.filter(m => 
                        (m.phone && m.phone.includes(query.trim())) || 
                        (m.studentId && m.studentId.toLowerCase().includes(query.trim().toLowerCase()))
                    );

                    if (matched.length > 0) {
                        setResult(matched);
                    } else {
                        setError('找不到符合的報名資料，請確認輸入是否正確。');
                    }
                } catch (err) {
                    setError('連線資料庫發生錯誤，請稍後再試。');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="p-6 space-y-4">
                    <div>
                        <button onClick={() => setPage('home')} className="text-xs text-blue-600 hover:underline mb-2 inline-block">← 回到主選單</button>
                        <h2 className="text-xl font-bold text-gray-900">查詢您的識別碼</h2>
                        <p className="text-xs text-gray-500 mt-0.5">輸入手機號碼或學號即可檢索您的身分與識別碼</p>
                    </div>

                    <form onSubmit={handleSearch} className="space-y-3">
                        <input 
                            type="text" 
                            value={query} 
                            onChange={(e) => setQuery(e.target.value)} 
                            placeholder="請輸入手機號碼或學號..." 
                            className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                        />
                        <button type="submit" disabled={loading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow transition text-sm">
                            {loading ? '查詢中...' : '開始查詢'}
                        </button>
                    </form>

                    {error && <div className="p-3 bg-red-50 text-red-700 text-xs rounded-xl text-center">{error}</div>}

                    {result && (
                        <div className="space-y-3 pt-2">
                            <div className="text-xs font-semibold text-gray-500">找到以下符合的資料：</div>
                            {result.map((m, idx) => {
                                const code = m.phone || m.studentId;
                                return (
                                    <div key={idx} className="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-gray-900 text-base">{m.name}</span>
                                            <span className="text-xs px-2.5 py-1 bg-gray-200 rounded-full text-gray-700">{m.type}</span>
                                        </div>
                                        <div className="text-xs text-gray-600">識別代碼：<span className="font-mono font-bold text-blue-600 text-sm">{code}</span></div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [page, setPage] = useState('home');

            return (
                <div className="w-full max-w-md mx-auto bg-white min-h-screen shadow-lg relative flex flex-col justify-between">
                    <div>
                        <Header onBack={page !== 'home' ? () => setPage('home') : null} />
                        <main className="flex-1">
                            {page === 'home' && <Home setPage={setPage} />}
                            {page === 'purchase' && <PurchaseForms setPage={setPage} />}
                            {page === 'barcode' && <BarcodeGenPage setPage={setPage} />}
                        </main>
                    </div>
                    <footer className="text-center py-6 text-xs text-gray-400 border-t border-gray-50">
                        &copy; 台大拳擊社 活動點名與報名系統
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
